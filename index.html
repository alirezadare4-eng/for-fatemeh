<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>برای فاطمه 🤍</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@200;300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #11050a;
      --paper: rgba(26, 11, 18, 0.68);
      --border: rgba(244, 180, 188, 0.22);
      --gold: #ecc8a0;
      --rose-glow: #fb7185;
      --text: #fdf6f7;
      --muted: rgba(253, 246, 247, 0.58);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Vazirmatn', sans-serif;
      background: radial-gradient(circle at 50% 12%, #2e0d1c 0%, #16060e 52%, #080205 100%);
      color: var(--text);
      min-height: 100dvh;
      overflow-x: hidden;
      position: relative;
      line-height: 2.1;
      font-weight: 300;
      transition: background 2.5s ease;
    }

    body.night-mode {
      background: radial-gradient(circle at 50% 12%, #24102e 0%, #11071a 55%, #06030a 100%);
    }

    /* Romantic Floating Bokeh Orbs in Background */
    .bokeh-wrap {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .bokeh-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(65px);
      opacity: 0.42;
      animation: floatOrb 14s ease-in-out infinite alternate;
    }

    .orb-1 {
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, rgba(225, 29, 72, 0.45), transparent 70%);
      top: 5%;
      right: -80px;
    }

    .orb-2 {
      width: 420px;
      height: 420px;
      background: radial-gradient(circle, rgba(236, 200, 160, 0.32), transparent 70%);
      top: 42%;
      left: -110px;
      animation-duration: 18s;
    }

    .orb-3 {
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, rgba(244, 63, 94, 0.35), transparent 70%);
      bottom: 5%;
      right: 10%;
      animation-duration: 16s;
    }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, -35px) scale(1.12); }
    }

    #romantic-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* Minimal Intro Veil */
    #intro-veil {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: radial-gradient(circle at center, #260b17 0%, #0a0307 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.4rem;
      cursor: pointer;
      transition: opacity 1.5s cubic-bezier(0.4, 0, 0.2, 1), visibility 1.5s;
    }

    #intro-veil.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .veil-heart {
      font-size: 2.2rem;
      filter: drop-shadow(0 0 18px rgba(251, 113, 133, 0.8));
      animation: breathe 2.6s ease-in-out infinite;
    }

    .veil-title {
      font-size: 1.5rem;
      font-weight: 400;
      letter-spacing: 1px;
      color: var(--gold);
      text-shadow: 0 0 20px rgba(236, 200, 160, 0.35);
    }

    .veil-sub {
      font-size: 0.88rem;
      font-weight: 300;
      color: var(--muted);
      border: 1px solid rgba(244, 180, 188, 0.25);
      padding: 0.5rem 1.4rem;
      border-radius: 999px;
      background: rgba(251, 113, 133, 0.08);
    }

    @keyframes breathe {
      0%, 100% { transform: scale(0.95); opacity: 0.75; }
      50% { transform: scale(1.12); opacity: 1; }
    }

    /* Main Editorial Container */
    .page-wrap {
      position: relative;
      z-index: 5;
      max-width: 620px;
      margin: 0 auto;
      padding: 3.8rem 1.4rem 9rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Minimal Header */
    .top-dedication {
      text-align: center;
      margin-bottom: 2.2rem;
    }

    .top-dedication span {
      display: inline-block;
      font-size: 0.76rem;
      letter-spacing: 2.5px;
      color: var(--gold);
      opacity: 0.85;
      margin-bottom: 0.45rem;
    }

    .top-dedication h1 {
      font-size: clamp(1.55rem, 4vw, 2.15rem);
      font-weight: 400;
      color: var(--text);
      text-shadow: 0 2px 25px rgba(251, 113, 133, 0.35);
    }

    /* Single Morphing Photo Frame (Childhood -> Click -> Smooth Fade to Adult) */
    .single-photo-stage {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 1.8rem;
    }

    .magic-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 5;
      border-radius: 24px;
      overflow: hidden;
      background: #14070d;
      border: 1px solid rgba(236, 200, 160, 0.35);
      box-shadow:
        0 28px 75px rgba(0, 0, 0, 0.75),
        0 0 45px rgba(225, 29, 72, 0.22);
      cursor: pointer;
      transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.8s ease;
    }

    .magic-frame:hover {
      transform: translateY(-4px);
      box-shadow:
        0 32px 85px rgba(0, 0, 0, 0.85),
        0 0 55px rgba(236, 200, 160, 0.32);
    }

    .photo-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 1.8s cubic-bezier(0.4, 0, 0.2, 1), transform 1.8s cubic-bezier(0.4, 0, 0.2, 1), filter 1.8s ease;
    }

    #layer-child {
      z-index: 2;
      opacity: 1;
      transform: scale(1);
    }

    #layer-adult {
      z-index: 1;
      opacity: 1;
      transform: scale(1.04);
    }

    /* When morphed to Adult photo */
    .magic-frame.show-adult #layer-child {
      opacity: 0;
      transform: scale(1.08);
      filter: blur(6px);
      pointer-events: none;
    }

    .magic-frame.show-adult #layer-adult {
      transform: scale(1);
    }

    /* Shimmer flash during photo transition */
    .magic-frame::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle, rgba(236, 200, 160, 0.35) 0%, transparent 70%);
      opacity: 0;
      z-index: 4;
      pointer-events: none;
      transition: opacity 0.9s ease;
    }

    .magic-frame.flashing::after {
      opacity: 1;
    }

    .frame-caption-bar {
      position: absolute;
      inset: auto 0 0 0;
      z-index: 5;
      padding: 2.8rem 1rem 0.95rem;
      background: linear-gradient(to top, rgba(14, 5, 10, 0.92) 0%, rgba(14, 5, 10, 0.45) 60%, transparent 100%);
      text-align: center;
    }

    .frame-caption-text {
      font-size: 0.86rem;
      color: var(--gold);
      font-weight: 400;
      margin-bottom: 0.3rem;
      transition: opacity 0.4s ease;
    }

    .frame-tap-hint {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.74rem;
      color: rgba(255, 255, 255, 0.78);
      background: rgba(251, 113, 133, 0.16);
      border: 1px solid rgba(244, 180, 188, 0.3);
      padding: 0.25rem 0.85rem;
      border-radius: 999px;
      backdrop-filter: blur(8px);
      transition: all 0.3s ease;
    }

    .magic-frame:hover .frame-tap-hint {
      background: rgba(236, 200, 160, 0.24);
      border-color: var(--gold);
      color: #fff;
    }

    /* Live Voiceover Whisper Line (Between Photo & Letter) */
    .voice-whisper {
      width: 100%;
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0.7rem 1rem;
      margin-bottom: 2.2rem;
      border-top: 1px solid rgba(244, 180, 188, 0.12);
      border-bottom: 1px solid rgba(244, 180, 188, 0.12);
      background: radial-gradient(circle, rgba(251, 113, 133, 0.07) 0%, transparent 75%);
    }

    .voice-whisper p {
      font-size: 0.96rem;
      color: var(--gold);
      font-weight: 300;
      text-shadow: 0 0 18px rgba(236, 200, 160, 0.35);
      transition: opacity 0.4s ease;
    }

    /* Live-Written Letter Sheet */
    .letter-sheet {
      width: 100%;
      background: var(--paper);
      backdrop-filter: blur(22px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: clamp(1.8rem, 5vw, 3rem) clamp(1.4rem, 5vw, 2.6rem);
      box-shadow:
        0 30px 90px rgba(0, 0, 0, 0.75),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      position: relative;
    }

    .letter-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.8rem;
      padding-bottom: 0.9rem;
      border-bottom: 1px solid rgba(244, 180, 188, 0.12);
      font-size: 0.76rem;
      color: var(--muted);
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .ink-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--rose-glow);
      box-shadow: 0 0 12px var(--rose-glow);
      animation: pulseInk 1.4s infinite;
    }

    @keyframes pulseInk {
      0%, 100% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.3); }
    }

    .text-actions {
      display: flex;
      gap: 0.85rem;
    }

    .text-action-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-family: inherit;
      font-size: 0.75rem;
      cursor: pointer;
      transition: color 0.25s ease;
    }

    .text-action-btn:hover {
      color: var(--gold);
    }

    /* The Live Typewriter Container */
    .letter-content {
      font-size: clamp(1rem, 2.4vw, 1.12rem);
      line-height: 2.25;
      color: var(--text);
      font-weight: 300;
      text-align: justify;
      white-space: pre-wrap;
      min-height: 260px;
    }

    /* Glowing Pen Cursor */
    .pen-cursor {
      display: inline-block;
      width: 2px;
      height: 1.15em;
      background: var(--gold);
      box-shadow: 0 0 12px var(--rose-glow);
      vertical-align: middle;
      margin-right: 4px;
      animation: blinkCursor 0.85s infinite;
    }

    .pen-cursor.done {
      display: none;
    }

    @keyframes blinkCursor {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.15; }
    }

    /* Minimal Floating Bottom Audio Dock */
    .minimal-dock {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 90;
      background: rgba(22, 9, 16, 0.88);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(244, 180, 188, 0.22);
      border-radius: 999px;
      padding: 0.45rem 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.8), 0 0 25px rgba(225, 29, 72, 0.15);
      max-width: 94vw;
    }

    .dock-play {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid rgba(236, 200, 160, 0.45);
      background: rgba(251, 113, 133, 0.15);
      color: var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.25s ease;
      flex-shrink: 0;
    }

    .dock-play:hover {
      background: var(--gold);
      color: #12060c;
    }

    .dock-tracks {
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .dock-pill {
      background: transparent;
      border: none;
      color: var(--muted);
      font-family: inherit;
      font-size: 0.76rem;
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.25s ease;
      white-space: nowrap;
    }

    .dock-pill.active {
      background: rgba(251, 113, 133, 0.2);
      color: var(--gold);
      font-weight: 400;
    }

    .dock-progress {
      width: 70px;
      height: 3px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 99px;
      overflow: hidden;
      cursor: pointer;
      flex-shrink: 0;
    }

    .dock-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--gold), var(--rose-glow));
      transition: width 0.15s linear;
    }
  </style>
</head>
<body>

  <!-- Romantic Warm Bokeh Background -->
  <div class="bokeh-wrap">
    <div class="bokeh-orb orb-1"></div>
    <div class="bokeh-orb orb-2"></div>
    <div class="bokeh-orb orb-3"></div>
  </div>
  <canvas id="romantic-canvas"></canvas>

  <!-- Minimal Entry Veil -->
  <div id="intro-veil" onclick="beginStory()">
    <div class="veil-heart">🤍</div>
    <div class="veil-title">برای فاطمهٔ عزیزم</div>
    <div class="veil-sub">صفحه رو لمس کن تا قصه‌مون شروع بشه...</div>
  </div>

  <div class="page-wrap">
    <!-- Subtle Header -->
    <header class="top-dedication">
      <span>ALIREZA &amp; FATEMEH</span>
      <h1>قصه‌ای که از کودکی به امروز رسید</h1>
    </header>

    <!-- Single Morphing Photo Frame: Starts with Childhood -> Click -> Fades to Adult -->
    <section class="single-photo-stage">
      <div class="magic-frame" id="magic-frame" onclick="togglePhotoMorph()">
        <img src="assets/childhood.jpg" class="photo-layer" id="layer-child" alt="کودکی علیرضا و فاطمه" />
        <img src="assets/adult.jpg" class="photo-layer" id="layer-adult" alt="بزرگسالی علیرضا و فاطمه در آینه" />

        <div class="frame-caption-bar">
          <div class="frame-caption-text" id="photo-caption">
            «از همون بچگی قرار بود مال هم باشیم...»
          </div>
          <div class="frame-tap-hint" id="photo-hint">
            ✨ روی عکس بزن تا ببینی چطور بزرگ شدیم
          </div>
        </div>
      </div>
    </section>

    <!-- Synchronized Voiceover Whisper Line -->
    <div class="voice-whisper">
      <p id="voice-line">«قصه‌ای که از کودکی شروع نشد، اما به کودکی رسید...»</p>
    </div>

    <!-- The Living Handwritten Letter -->
    <article class="letter-sheet" id="letter-box">
      <div class="letter-toolbar">
        <div class="status-indicator">
          <span class="ink-dot" id="ink-dot"></span>
          <span id="write-status">در حال نوشتن حرف‌های دلم برای تو...</span>
        </div>
        <div class="text-actions">
          <button class="text-action-btn" onclick="finishWritingNow()">نمایش کامل متن</button>
          <span>•</span>
          <button class="text-action-btn" onclick="restartWriting()">نوشتن دوباره</button>
        </div>
      </div>

      <div class="letter-content" id="letter-target"></div>
    </article>
  </div>

  <!-- Ultra-Minimal Bottom Audio Dock -->
  <div class="minimal-dock">
    <button class="dock-play" id="dock-play-btn" onclick="toggleActiveAudio()">▶</button>
    <div class="dock-tracks">
      <button class="dock-pill active" id="pill-story" onclick="switchAudio(1)">صدای قصه‌ی ما</button>
      <button class="dock-pill" id="pill-shab" onclick="switchAudio(2)">شب ۲ (امیر تتلو)</button>
    </div>
    <div class="dock-progress" id="dock-prog" onclick="seekActiveAudio(event)">
      <div class="dock-bar" id="dock-bar"></div>
    </div>
  </div>

  <audio id="audio-story" src="assets/story.mp3" preload="metadata"></audio>
  <audio id="audio-shab" src="assets/shab2.mp3" preload="metadata"></audio>

  <script>
    // ==============================================
    // 1. Single Photo Frame Morph (Childhood -> Adult)
    // ==============================================
    let isShowingAdult = false;
    let autoMorphedAtClimax = false;
    const magicFrame = document.getElementById('magic-frame');
    const photoCaption = document.getElementById('photo-caption');
    const photoHint = document.getElementById('photo-hint');

    function setPhotoMorph(showAdult) {
      isShowingAdult = showAdult;
      magicFrame.classList.add('flashing');
      setTimeout(() => magicFrame.classList.remove('flashing'), 800);

      if (isShowingAdult) {
        magicFrame.classList.add('show-adult');
        photoCaption.textContent = '«کودکی دیروز و نگاهِ امروزمون در قاب آینه ❤️»';
        photoHint.textContent = '🧸 لمس کن برای برگشتن به عکس بچگی‌مون';
        spawnFloatingHearts(10);
      } else {
        magicFrame.classList.remove('show-adult');
        photoCaption.textContent = '«از همون بچگی قرار بود مال هم باشیم...»';
        photoHint.textContent = '✨ روی عکس بزن تا ببینی چطور بزرگ شدیم';
      }
    }

    function togglePhotoMorph() {
      setPhotoMorph(!isShowingAdult);
    }

    // ==============================================
    // 2. The Exact Heartfelt Letter for Fatemeh
    // ==============================================
    const fullLetterText = `فاطمهٔ عزیزم،

نمیدونم از کجا شروع کنم؛ چون هر بار که میخوام حرف دلم رو بزنم، حس میکنم کلمه‌ها جلوی احساسم کم میارن. ولی این بار میخوام سعی کنم، چون تو لایقِ شنیدنِ این حرفایی.

از وقتی تو رو شناختم، همه‌چیز یه جور دیگه شده. روزهام معنا پیدا کردن، شب‌هام آروم‌تر شدن و دلم یاد گرفته چطور بدون دلیل، فقط با فکر کردن به تو لبخند بزنه. یه وقتایی وسط یه روز معمولی یهو یادت میافتم و حالم خوب میشه. این یعنی حضورت فقط توی لحظه‌هایی که کنارمی نیست؛ همیشه با منه.

لبخندت برای من یه دنیا ارزش داره. صدات آرامشه، نگاهت امنیته و حرف زدن باهات بهترین بخش هر روزمه. کنار تو لازم نیست خودم رو بزرگ‌تر یا بهتر از اونی که هستم نشون بدم؛ همین‌طوری که هستم کافیه. این حس رو کمتر کسی بهم داده و من قدرش رو میدونم.

تو فقط یه آدم دوست‌داشتنی نیستی، تو دلیلِ این هستی که میخوام بهتر بشم، صبورتر باشم، بیشتر بخندم و بیشتر قدر لحظه‌ها رو بدونم. دلم میخواد توی خوشی‌هات شریک باشم، وقتی خسته‌ای تکیه‌گاهت بشم و وقتی دلت میگیره، فقط کنارت بمونم، حتی بدون اینکه چیزی بگم.

نمیدونم آینده چی برامون در نظر گرفته، ولی میدونم هر جا که باشه، دلم میخواد تو هم اونجا باشی. دلم میخواد خاطره‌های قشنگ زیادی باهات بسازم، با هم بخندیم، با هم رشد کنیم و هیچ‌وقت یادمون نره که چقدر همدیگه رو خوشحال کردیم.

دوستت دارم فاطمه؛ نه برای یه روز یا یه لحظه، بلکه با تمام وجودم، با تمام قلبم و با تمام چیزهایی که از «دوست داشتن» میفهمم.

همیشه مال تو 🤍`;

    const letterTarget = document.getElementById('letter-target');
    const writeStatus = document.getElementById('write-status');
    const inkDot = document.getElementById('ink-dot');

    let charIndex = 0;
    let writeTimer = null;
    let isWriting = false;

    function renderTypedText(count) {
      const visible = fullLetterText.slice(0, count);
      const isDone = count >= fullLetterText.length;
      letterTarget.innerHTML = '';

      const textNode = document.createTextNode(visible);
      letterTarget.appendChild(textNode);

      const cursor = document.createElement('span');
      cursor.className = isDone ? 'pen-cursor done' : 'pen-cursor';
      letterTarget.appendChild(cursor);

      if (isDone) {
        writeStatus.textContent = 'با تمام قلبم برای تو 🤍';
        inkDot.style.animation = 'none';
        inkDot.style.opacity = '1';
      }
    }

    function stepWrite() {
      if (charIndex >= fullLetterText.length) {
        isWriting = false;
        renderTypedText(fullLetterText.length);
        return;
      }

      const ch = fullLetterText[charIndex];
      charIndex++;
      renderTypedText(charIndex);

      let delay = 50;
      if (ch === '،' || ch === '؛') delay = 250;
      else if (ch === '.' || ch === '\n') delay = 400;
      else if (ch === ' ') delay = 32;

      writeTimer = setTimeout(stepWrite, delay);
    }

    function startWriting() {
      if (isWriting) return;
      isWriting = true;
      writeStatus.textContent = 'در حال نوشتن حرف‌های دلم برای تو...';
      inkDot.style.animation = 'pulseInk 1.4s infinite';
      stepWrite();
    }

    function finishWritingNow() {
      clearTimeout(writeTimer);
      isWriting = false;
      charIndex = fullLetterText.length;
      renderTypedText(charIndex);
    }

    function restartWriting() {
      clearTimeout(writeTimer);
      isWriting = false;
      charIndex = 0;
      renderTypedText(0);
      startWriting();
    }

    // ==============================================
    // 3. Audio & Synchronized Voiceover Subtitles
    // ==============================================
    const voiceLines = [
      { s: 0, e: 9.5, t: "♪ ... قصه علیرضا و فاطمه ... ♪" },
      { s: 9.5, e: 17.5, t: "«قصه‌ای که از کودکی شروع نشد، اما به کودکی رسید...»" },
      { s: 17.5, e: 26, t: "«می‌خوام براتون قصه‌ی دو نفر رو تعریف کنم...»" },
      { s: 26, e: 34.8, t: "«یکی پسربچه‌ای با موهای مشکی و شیطنتِ نگاهش...»" },
      { s: 34.8, e: 43.8, t: "«و اون یکی دختر کوچولویی با دنیای معصوم و قشنگش...»" },
      { s: 43.8, e: 59.5, t: "«اونا نمی‌دونستن روزی قراره عکس‌هاشون کنار هم بشینه و قشنگ‌ترین بهانه برای لبخند امروزشون بشه...»" },
      { s: 59.5, e: 74, t: "«و بالاخره یک روز، مسیرِ زندگی این دو نفر به هم رسید...»" },
      { s: 74, e: 87, t: "«برای علیرضا، فاطمه کم‌کم تبدیل شد به یک آدمِ عزیز...»" },
      { s: 87, e: 100.5, t: "«دختری که دوست داشت بیشتر بشناسدش و کنارش آروم باشه...»" },
      { s: 100.5, e: 113, t: "«عشق یعنی وقتی دلش گرفت، لازم نباشه همیشه توضیح بده چرا...»" },
      { s: 113, e: 122.5, t: "«حالا به این دو تا عکس نگاه کن، که چطور زمان رو به سخره گرفتن...»" },
      { s: 122.5, e: 133.5, t: "«کودکیِ دیروز و نگاهِ امروزتون در قابِ این آینه‌ی جادویی عکس‌ها...»" },
      { s: 133.5, e: 144.8, t: "«من نمی‌تونم قول بدم که تمام روزهای آینده همیشه آفتابی باشن...»" },
      { s: 144.8, e: 155.5, t: "«اما می‌تونم آرزو کنم که بلد باشیم در آفتاب و بارون کنار هم بمونیم...»" },
      { s: 155.5, e: 165, t: "«این داستان برای توئه، از طرف پسری که روزی خودش هم یک کودک بود...»" },
      { s: 165, e: 185, t: "«دوستت دارم فاطمه 🤍 این تازه شروع قصه ماست...»" }
    ];

    let activeTrack = 1;
    const audioStory = document.getElementById('audio-story');
    const audioShab = document.getElementById('audio-shab');
    const voiceLine = document.getElementById('voice-line');
    const dockPlayBtn = document.getElementById('dock-play-btn');
    const dockBar = document.getElementById('dock-bar');

    function getAud() {
      return activeTrack === 1 ? audioStory : audioShab;
    }

    function beginStory() {
      document.getElementById('intro-veil').classList.add('fade-out');
      startWriting();
      spawnFloatingHearts(12);
      audioStory.play().then(() => {
        dockPlayBtn.textContent = '⏸';
      }).catch(() => {});
    }

    function toggleActiveAudio() {
      const aud = getAud();
      if (aud.paused) {
        aud.play();
        dockPlayBtn.textContent = '⏸';
      } else {
        aud.pause();
        dockPlayBtn.textContent = '▶';
      }
    }

    function switchAudio(num) {
      activeTrack = num;
      document.getElementById('pill-story').classList.toggle('active', num === 1);
      document.getElementById('pill-shab').classList.toggle('active', num === 2);

      if (num === 1) {
        audioShab.pause();
        document.body.classList.remove('night-mode');
        audioStory.play();
        dockPlayBtn.textContent = '⏸';
      } else {
        audioStory.pause();
        document.body.classList.add('night-mode');
        voiceLine.textContent = '🌙 در حال پخش: شب ۲ — امیر تتلو';
        if (!isShowingAdult) setPhotoMorph(true);
        audioShab.play();
        dockPlayBtn.textContent = '⏸';
      }
    }

    audioStory.addEventListener('timeupdate', () => {
      if (activeTrack !== 1) return;
      const t = audioStory.currentTime;
      const d = audioStory.duration || 180;
      dockBar.style.width = `${(t / d) * 100}%`;

      const found = voiceLines.find(item => t >= item.s && t < item.e);
      if (found && voiceLine.textContent !== found.t) {
        voiceLine.style.opacity = 0;
        setTimeout(() => {
          voiceLine.textContent = found.t;
          voiceLine.style.opacity = 1;
        }, 180);
      }

      // If user hasn't clicked the photo yet, automatically morph at 01:54 ("حالا به این دو تا عکس نگاه کن")
      if (t >= 114 && !autoMorphedAtClimax) {
        autoMorphedAtClimax = true;
        if (!isShowingAdult) setPhotoMorph(true);
      }
    });

    // Automatically play Amir Tataloo - Shab 2 when voiceover finishes
    audioStory.addEventListener('ended', () => {
      switchAudio(2);
    });

    audioShab.addEventListener('timeupdate', () => {
      if (activeTrack !== 2) return;
      const t = audioShab.currentTime;
      const d = audioShab.duration || 240;
      dockBar.style.width = `${(t / d) * 100}%`;
    });

    function seekActiveAudio(e) {
      const box = document.getElementById('dock-prog');
      const rect = box.getBoundingClientRect();
      const ratio = (e.clientX - rect.left) / rect.width;
      const aud = getAud();
      if (aud.duration) {
        aud.currentTime = ratio * aud.duration;
      }
    }

    // ==============================================
    // 4. Romantic Glowing Sparks & Soft Hearts Canvas
    // ==============================================
    const canvas = document.getElementById('romantic-canvas');
    const ctx = canvas.getContext('2d');
    let sparks = [];
    let softHearts = [];

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    for (let i = 0; i < 48; i++) {
      sparks.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 1.8 + 0.5,
        vy: -Math.random() * 0.35 - 0.08,
        vx: (Math.random() - 0.5) * 0.25,
        a: Math.random() * 0.65 + 0.15,
        color: Math.random() > 0.45 ? '#ecc8a0' : '#fb7185'
      });
    }

    function spawnFloatingHearts(count = 10) {
      for (let i = 0; i < count; i++) {
        softHearts.push({
          x: canvas.width * 0.25 + Math.random() * (canvas.width * 0.5),
          y: canvas.height * 0.6 + Math.random() * 80,
          size: Math.random() * 14 + 10,
          vy: Math.random() * 1.2 + 0.6,
          vx: (Math.random() - 0.5) * 0.7,
          a: 0.85
        });
      }
    }

    function animateRomanticBg() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (const s of sparks) {
        s.x += s.vx;
        s.y += s.vy;
        if (s.y < -5) s.y = canvas.height + 5;
        if (s.x < -5) s.x = canvas.width + 5;
        if (s.x > canvas.width + 5) s.x = -5;
        ctx.globalAlpha = s.a;
        ctx.fillStyle = s.color;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      }

      for (let i = softHearts.length - 1; i >= 0; i--) {
        const h = softHearts[i];
        h.y -= h.vy;
        h.x += Math.sin(h.y * 0.03) * 0.5 + h.vx;
        h.a -= 0.005;
        ctx.globalAlpha = Math.max(0, h.a);
        ctx.font = `${h.size}px sans-serif`;
        ctx.fillText('🤍', h.x, h.y);
        if (h.a <= 0) softHearts.splice(i, 1);
      }

      ctx.globalAlpha = 1;
      requestAnimationFrame(animateRomanticBg);
    }
    animateRomanticBg();
  </script>
</body>
</html>
